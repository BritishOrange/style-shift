[project]
name = "styleshift"
version = "0.1.0"
description = "Local text style-transfer service powered by Qwen2.5"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "MIT" }
authors = [{ name = "StyleShift" }]
dependencies = [
    "flask>=3.0",
    "torch>=2.2",
    "transformers>=4.44",
    "accelerate>=0.33",
    "sentencepiece>=0.2",
    "protobuf>=4.0",
    "numpy>=2.3",
]

[project.scripts]
styleshift = "styleshift.__main__:main"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "styleshift", from = "src" }]

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.0.0"
ruff = "^0.9.0"
mypy = "^1.14.0"
types-requests = "^2.32.0"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
]
ignore = [
    "B008", # function calls in argument defaults (Flask patterns)
]

[tool.ruff.lint.isort]
known-first-party = ["styleshift"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
mypy_path = "src"
packages = ["styleshift"]
